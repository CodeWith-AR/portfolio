          keyframes: {
            breathingGlow: {

                borderColor: 'rgba(234, 179, 8, 0.3)',

              },

<style data-purpose="cybernetic-styles">
    .glass-nav {
      background: rgba(19, 19, 22, 0.75);

    .device-bento-card {

    .device-bento-card:hover {

      box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.9), 0 0 35px -5px rgba(229, 9, 20, 0.22);
      transform: translateY(-4px);
    }

    .device-screen-tilt {

      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);

    .device-bento-card:hover .device-screen-tilt {

    .device-bento-card:hover .mobile-mockup-tilt {
